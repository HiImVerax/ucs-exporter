name: Build & CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: ucs-exporter-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: ucs-exporter-linux-arm64
          - goos: darwin
            goarch: amd64
            binary_name: ucs-exporter-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: ucs-exporter-darwin-arm64
          - goos: windows
            goarch: amd64
            binary_name: ucs-exporter-windows-amd64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "dev")
          REVISION=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +%Y%m%d-%H:%M:%S)

          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/prometheus/common/version.Version=${VERSION} \
              -X github.com/prometheus/common/version.Revision=${REVISION} \
              -X github.com/prometheus/common/version.Branch=${BRANCH} \
              -X github.com/prometheus/common/version.BuildUser=github-actions \
              -X github.com/prometheus/common/version.BuildDate=${BUILD_DATE}" \
            -o dist/${{ matrix.binary_name }} \
            ./cmd/ucs-exporter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
